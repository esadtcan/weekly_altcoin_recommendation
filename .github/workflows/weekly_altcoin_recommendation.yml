name: weekly_altcoin_recommendation

on:
  workflow_dispatch:
  schedule:
    # Avoid the top-of-hour congestion window on GitHub-hosted runners.
    # GitHub Actions schedules use UTC. 06:05 UTC is 09:05 in Istanbul.
    - cron: "5 6 * * 1"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      COINGECKO_PLAN: demo
      BASKET_BUDGET_USD: "100"
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_STARTTLS: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Send report
        run: python -m weekly_altcoin_recommendation
