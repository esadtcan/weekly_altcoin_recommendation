[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly_altcoin_recommendation"
version = "0.1.0"
description = "Weekly, explainable altcoin basket ranking and email report"
requires-python = ">=3.9"

[project.scripts]
weekly_altcoin_recommendation = "weekly_altcoin_recommendation.__main__:main"

[tool.setuptools]
packages = ["weekly_altcoin_recommendation"]
